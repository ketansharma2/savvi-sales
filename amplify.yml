version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci

    build:
      commands:
        - env | grep -e ACCESS_TOKEN_SECRET -e REFRESH_TOKEN_SECRET -e MONGODB_URI >> .env.production
        - npm run build

  artifacts:
    baseDirectory: .next
    files:
      - '**/*'

  cache:
    paths:
      - node_modules/**/*